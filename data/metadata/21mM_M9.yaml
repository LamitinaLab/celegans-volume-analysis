# ============================
# Experiment-level metadata
# ============================

assay: volume
experiment_id: 260117
assay_date: 260117
analysis_date:

# ---- Genotype information (ONE strain per file) ----
genotype: +/+
strain: N2
background: N2        #  lab N2
outcrosses: unknown        # 
age: Day 1 #L4=day 0

# ---- Treatment ----
NaCl_concentration_mM: 21
buffer: M9

# ---- Personnel ----
experimenter: TL
lab: Lamitina

# ============================
# Arena information
# ============================

arena:
  type: single_chamber_acrylic
  diameter_mm: 35        # <-- replace ??
  thickness_mm: 0.1

# ============================
# Imaging parameters
# ============================

imaging:
  frame_rate_hz: 14
  resolution_px: [2456, 2052]
  camera: Basler_acA2440_35um
  illumination: IR
  intensity_value: 27
  scale_um_px: 10    
  temperature_C: 20      # growth temp

# ============================
# WormLab configuration
# ============================

wormlab:
  version: 2024.3
  tracking_mode: multiworm
  configuration: Todd_Osr

# ============================
# Notes
# ============================

notes: >
  Standard volume assay.
  Animals age-synchronized.
  Day 1 adults.
  Recorded immediately after solution mixing.

# ============================
# Per-video metadata
# Only include entries that differ from defaults
# ============================

videos:

  "0001":
    file: 0001.avi
    usable: true
    notes: lots of track dropping, takes long time to repair. 4 tracks

  "0002":
    file: 0002.avi
    usable: true
    notes:  retracked with slightly different settings and using a custom label. worked much better, 3 tracks

  "0003":
    file: 0003.avi
    usable: false
    exclusion_reason: poor worm tracking due to air bubbles in arena

  "0004":
    file: 0004.avi
    usable: true

  "0005":
    file: 0005.avi
    usable: true

  "0006":
    file: 0006.avi
    usable: true 
    #worm 1 entangled with a fiber, has poor fit but some good frames so kept

