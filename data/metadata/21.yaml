# ============================
# Experiment-level metadata
# ============================

assay: volume
experiment_id: 260311
assay_date: 260311
analysis_date: 260828
condition_order: 0          # display/analysis order within experiment

# ---- Genotype information (ONE strain per file) ----
genotype: +/+
strain: N2
background: N2             # genetic background
outcrosses: unknown        # number of outcrosses, if known
age: Day 1                 # L4 = Day 0

# ---- Treatment ----
treatment: none                 # e.g. none, auxin, levamisole, heat_shock
treatment_level: null           # concentration, temperature, etc.
treatment_level_unit: null      # e.g. mM, uM, degC
treatment_duration: null        # treatment exposure duration
treatment_duration_unit: null   # e.g. min, h, d
treatment_timing: null          # pre_assay, during_assay, or continuous

# ---- Assay conditions ----
NaCl_concentration_mM: 21      # NaCl concentration during volume assay
buffer: M9

# ---- Personnel ----
experimenter: TL
lab: Lamitina

# ============================
# Arena information
# ============================

arena:
  type: single_chamber_acrylic
  diameter_mm: 35        # <-- replace ??
  thickness_mm: 0.1

# ============================
# Imaging parameters
# ============================

imaging:
  frame_rate_hz: 14
  resolution_px: [2456, 2052]
  lens_fstop_mm:  4.0
  camera: Basler_acA2440_35um
  illumination: IR
  intensity_value: 27
  scale_um_px: 10    
  temperature_C: 20      # growth temp

# ============================
# WormLab configuration
# ============================

wormlab:
  version: 2024.3
  tracking_mode: multiworm
  configuration: Todd_Osr

# ============================
# Notes
# ============================

notes: >
  Standard volume assay.
  Animals age-synchronized.
  Day 1 adults.
  Recorded immediately after solution mixing.

# ============================
# Per-video metadata
# Only include entries that differ from defaults
# ============================

videos:

  "0001":
    file: 0001.avi
    usable: true
    notes: 

  "0002":
    file: 0002.avi
    usable: true

  "0003":
    file: 0002.avi
    usable: true

  "0004":
    file: 0002.avi
    usable: true

  "0005":
    file: 0002.avi
    usable: true

  "0006":
    file: 0002.avi
    usable: true

  "0007":
    file: 0002.avi
    usable: true

  # Example exclusion
  # "0003":
  #   file: RK202_0003.avi
  #   usable: false
  #   exclusion_reason: debris in arena

  # Example override
