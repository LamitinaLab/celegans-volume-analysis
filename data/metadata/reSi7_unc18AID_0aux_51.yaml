# ============================
# Experiment-level metadata
# ============================

assay: volume
experiment_id: 260811
assay_date: 260811
analysis_date: 260821

# ---- Genotype information (ONE strain per file) ----
genotype: reSi7 I; unc-18(knu969[unc-18::AID*]) X
strain: DLW114
background: N2        #  lab N2
outcrosses: 3        # 
age: Day 1 #L4=day 0

# ---- Treatment ----
NaCl_concentration_mM: 51
buffer: M9
auxin_concentration_mM: 0.0

# ---- Personnel ----
experimenter: TL
lab: Lamitina

# ============================
# Arena information
# ============================

arena:
  type: single_chamber_acrylic_v2.0
  diameter_mm: 20        # <-- replace ??
  thickness_mm: 0.1
  volume_ul: 40

# ============================
# Imaging parameters
# ============================

imaging:
  frame_rate_hz: 14
  resolution_px: [2456, 2052]
  lens_fstop_mm:  4.0
  camera: Basler_acA2440_35um
  illumination: IR
  intensity_value: 23
  scale_um_px: 10    
  temperature_C: 20      # growth temp

# ============================
# WormLab configuration
# ============================

wormlab:
  version: 2024.3
  tracking_mode: multiworm
  configuration: TL_OSR_new_chip_270801

# ============================
# Notes
# ============================

notes: >
  Standard volume assay but with new chips.
  Animals age-synchronized.
  Day 1 adults.
  Recorded immediately after solution mixing.

# ============================
# Per-video metadata
# Only include entries that differ from defaults
# ============================

videos:

  "0001":
    file: 0001.avi
    usable: true
    notes: 

  "0002":
    file: 0002.avi
    usable: true

    
